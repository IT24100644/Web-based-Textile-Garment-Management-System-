<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <style>
        :root{
            --bg:#ffffff;
            --fg:#1f2937; /* dark gray for text */
            --muted:#6b7280;
            --accent:#2563eb; /* blue */
            --accent-2:#38bdf8;
            --surface:#f3f4f6;
            --border:#d1d5db;
        }
        *{box-sizing:border-box}
        html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);font-family:Arial, sans-serif;}

        /* Header */
        .topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.9);backdrop-filter:saturate(180%) blur(10px);border-bottom:1px solid var(--border)}
        .container{max-width:1180px;margin:0 auto;padding:0 20px}
        .nav{display:flex;align-items:center;justify-content:space-between;height:72px}
        .brand{font-weight:800;font-size:28px;letter-spacing:.2px;color:var(--accent)}
        .navlinks{display:flex;gap:28px;align-items:center}
        .navlinks a{font-weight:600;color:var(--fg)}
        .navlinks a:hover{color:var(--accent)}
        .util{display:flex;gap:18px;align-items:center}
        .search{display:flex;align-items:center;gap:8px;border-bottom:2px solid var(--border);padding:6px 0}
        .search input{border:0;outline:0;background:transparent;font:inherit;width:160px;color:var(--fg)}
        .icon{width:18px;height:18px;display:inline-block}
        .flex{display:flex;align-items:center;gap:8px}

        /* Login box */
        body{display:flex;flex-direction:column;min-height:100vh;}
        .main-content{flex:1;display:flex;align-items:center;justify-content:center;background:#f7f7f7;}
        .login-box{background:white;padding:24px;border-radius:8px;
            box-shadow:0 2px 6px rgba(0,0,0,0.2);width:300px;}
        h2{margin-top:0;text-align:center;}
        label{display:block;margin:12px 0 6px;}
        input{width:100%;padding:8px;box-sizing:border-box;}
        button{margin-top:16px;width:100%;padding:10px;background:#0073e6;
            color:white;border:none;border-radius:4px;cursor:pointer;}
        button:hover{background:#005bb5;}
        .error{color:red;margin-top:10px;text-align:center;}
    </style>
</head>
<body>
<!-- Header -->
<header class="topbar">
    <div class="container nav">
        <div class="brand">
            <a href="http://localhost:8080" style="color: inherit; text-decoration: none;">LankaTex</a>
        </div>
        <nav class="navlinks" aria-label="Main Navigation">
            <a href="#shop">Shop</a>
            <a href="#about">About</a>
            <a href="#faq">FAQ</a>
            <a href="#gift">Gift Card</a>
            <a href="#contact">Contact</a>
        </nav>
        <div class="util">
            <label class="search" aria-label="Site search">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="search" placeholder="Search" />
            </label>
            <a href="login" class="flex" title="login" aria-label="login">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M20 21a8 8 0 0 0-16 0"/>
                    <circle cx="12" cy="7" r="4"/>
                </svg>
            </a>
            <a href="#cart" class="flex" title="Cart" aria-label="Cart">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="9" cy="21" r="1"/>
                    <circle cx="20" cy="21" r="1"/>
                    <path d="M1 1h4l2.68 12.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
                </svg>
            </a>
        </div>
    </div>
</header>

<!-- Login form area -->
<div class="main-content">
    <div class="login-box">
        <h2>Please Sign In</h2>
        <form th:action="@{/login}" method="post">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>

            <button type="submit">Login</button>

            <div th:if="${param.error}" class="error">Invalid username or password</div>
            <div th:if="${param.logout}" class="error">You have been logged out</div>
        </form>
    </div>
</div>
</body>
</html>
